<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 24 24">
  <!-- Background: Indigo Squircle -->
  <rect width="24" height="24" rx="5" fill="#4f46e5" />
  
  <!-- Truck Content: Solid White Stroke, Semi-transparent Fill -->
  <g transform="translate(2.4, 2.4) scale(0.8)">
      <!-- Cargo Body -->
      <rect x="8" y="3" width="15" height="13" rx="2" ry="2" fill="white" fill-opacity="0.2" stroke="white" stroke-width="1.5" stroke-linejoin="round" />
      
      <!-- Cab (Facing Left) -->
      <polygon points="8 8 4 8 1 11 1 16 8 16 8 10" fill="white" fill-opacity="0.2" stroke="white" stroke-width="1.5" stroke-linejoin="round" />
      
      <!-- Wheels -->
      <circle cx="18.5" cy="18.5" r="2.5" fill="white" />
      <circle cx="5.5" cy="18.5" r="2.5" fill="white" />
  </g>
</svg>